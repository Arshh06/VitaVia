# VitaVia Spring Boot Unified Configuration
server.port=${PORT:8080}
spring.application.name=VitaVia

# Database Configuration (Configurable Persistent File-Backed H2 with In-Memory fallback option)
# By default, uses file-backed storage so data survives application restarts.
# Override via SPRING_DATASOURCE_URL env var or switch to in-memory: jdbc:h2:mem:vitaviadb
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/vitaviadb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# External API Integrations (Optional keys, automatic deterministic fallbacks built-in)
vitavia.gemini.api-key=${GEMINI_API_KEY:}
vitavia.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.cache=false

# Logging Configuration
logging.level.com.vitavia=INFO
logging.level.org.springframework.web=INFO
